<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход · NormGraph Admin</title>
  <link rel="stylesheet" href="/admin/ui/assets/admin.css">
  <script src="/admin/ui/assets/admin.js" defer></script>
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand-mark">N</div><p class="eyebrow">IDU · NORMGRAPH</p>
    <h1>Панель управления</h1>
    <p class="muted">Войдите учётной записью IDU с правами администратора.</p>
    <form id="login-form" class="stack">
      <label>Логин<input name="username" required maxlength="256" autocomplete="username" autofocus></label>
      <label>Пароль<input name="password" type="password" required autocomplete="current-password"></label>
      <button class="button primary" type="submit">Войти</button>
    </form>
    <p id="login-error" class="form-error" role="alert"></p>
    <noscript>Для работы панели необходимо включить JavaScript.</noscript>
  </main>
</body>
</html>
