[project]
name = "NormGraph"
version = "0.11.0"
requires-python = "<3.14,>=3.13"
dependencies = [
    "fastapi==0.142.2",
    "fastmcp>=3.4.5",
    "httpx>=0.28.1",
    "idu-service-auth @ https://github.com/IDUclub/idu-service-auth/archive/1b8a418d9b1ab702860eb7289a3b75244666a8d8.tar.gz",
    "langextract==1.7.0",
    "neo4j==6.3.1",
    "otteroad>=0.3.0",
    "pydantic-settings==2.15.0",
    "structlog>=26.1.0",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "commitizen==4.19.0",
    "pre-commit==4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.22.0",
]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
version_scheme = "pep440"
tag_format = "v$version"
version_files = [
    "src/__version__.py:VERSION",
]
update_changelog_on_bump = true
major_version_zero = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "integration: tests that require the live local stack (Neo4j, IDU_DVD, LLM/embeddings); skipped automatically when a service is unavailable",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
