[project]
name = "NormGraph"
version = "0.1.0"
requires-python = "<3.14,>=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "fastmcp>=3.4.5",
    "httpx>=0.28.1",
    "langextract>=1.6.0",
    "neo4j>=6.2.0",
    "otteroad>=0.3.0",
    "pydantic-settings>=2.14.2",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "commitizen>=4.16.4",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.22.0",
]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
version_scheme = "pep440"
tag_format = "v$version"
version_files = [
    "src/__version__.py:VERSION",
]
update_changelog_on_bump = true
major_version_zero = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "integration: tests that require the live local stack (Neo4j, IDU_DVD, LLM/embeddings); skipped automatically when a service is unavailable",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
